# ==========================================
# HYPRLAND CONFIG
# ==========================================

# ==========================================
# MONITOR
# ==========================================
monitor=HDMI-A-1,1920x1080@75,auto,1

# ==========================================
# INPUT
# ==========================================
input {
    kb_layout = us
    follow_mouse = 1
    sensitivity = 0
    numlock_by_default = true
}

# ==========================================
# ENVIRONMENT
# ==========================================
env = XCURSOR_THEME,Bibata-Modern-Ice
env = XCURSOR_SIZE,24

# ==========================================
# APPEARANCE
# ==========================================
general{
  gaps_in=2
  gaps_out=5
  border_size=1
  col.active_border=rgba(33ccffee) rgba(00ff99ee) 45deg
  col.inactive_border=rgba(595959aa)
  layout=dwindle
}
decoration{
  rounding=4
}

# ==========================================
# ANIMATIONS
# ==========================================
animations {
    enabled = yes
    bezier = myBezier, 0.05, 0.9, 0.1, 1.05
    animation = windows, 1, 7, myBezier, slide
    animation = windowsOut, 1, 7, myBezier, slide
    animation = fade, 1, 7, default
    animation = workspaces, 1, 6, default, slidevert
    animation = border, 1, 10, default
}

# ==========================================
# AUTOSTART (exec once on login)
# ==========================================
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP=Hyprland
exec-once = gnome-keyring-daemon --start --components=secrets
exec-once = hyprpaper
exec-once = hypridle
exec-once = waybar
exec-once = swaync
exec-once = nm-applet
exec-once = systemctl --user start hyprpolkitagent
exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store


# ==========================================
# VARIABLES
# ==========================================
$mainMod = SUPER
$terminal = kitty
$fileManager = thunar
$menu = wofi --show drun

# ==========================================
# KEYBINDINGS: LAUNCH APPS
# ==========================================
bind = $mainMod, T, exec, $terminal
bind = $mainMod, E, exec, $fileManager
bind = $mainMod, SPACE, exec, $menu
bind = $mainMod, B, exec, brave-origin
bind = $mainMod, Z, exec, zed
bind = $mainMod, period, exec, ~/.config/wofi/emoji.sh

bind = $mainMod, V, exec, cliphist list | wofi --dmenu | cliphist decode | wl-copy

# ==========================================
# KEYBINDINGS: WINDOW MANAGEMENT
# ==========================================
bind = $mainMod, X, killactive
bind = $mainMod, F, fullscreen,1
bind = $mainMod SHIFT, V, togglefloating
bind = $mainMod, S, swapnext
bind = $mainMod, P, pseudo

bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

# ==========================================
# KEYBINDINGS: SCREENSHOTS
# ==========================================
bind = $mainMod SHIFT, S, exec, /home/rahul/.config/hypr/screenshot.sh


# ==========================================
# KEYBINDINGS: SYSTEM (LOCK / EXIT / POWER)
# ==========================================
bind = $mainMod, L, exec, loginctl lock-session
bind = $mainMod, Escape, exec, wlogout
bind = $mainMod, M, exec, command -v hyprshutdown >/dev/null 2>&1 && hyprshutdown || hyprctl dispatch exit

# ==========================================
# KEYBINDINGS: WORKSPACES
# ==========================================
bind = SUPER, mouse_down, workspace, e+1
bind = SUPER, mouse_up, workspace, e-1
bind = SUPER, TAB, workspace, previous

bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5

bind = $mainMod, KP_End, workspace, 1
bind = $mainMod, KP_Down, workspace, 2
bind = $mainMod, KP_Next, workspace, 3
bind = $mainMod, KP_Left, workspace, 4
bind = $mainMod, KP_Begin, workspace, 5
bind = $mainMod, KP_Right, workspace, 6
bind = $mainMod, KP_Home, workspace, 7
bind = $mainMod, KP_Up, workspace, 8
bind = $mainMod, KP_Prior, workspace, 9

bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5

bind = $mainMod SHIFT, KP_End, movetoworkspace, 1
bind = $mainMod SHIFT, KP_Down, movetoworkspace, 2
bind = $mainMod SHIFT, KP_Next, movetoworkspace, 3
bind = $mainMod SHIFT, KP_Left, movetoworkspace, 4
bind = $mainMod SHIFT, KP_Begin, movetoworkspace, 5

# ==========================================
# KEYBINDINGS: RESIZE FLOATING WINDOWS
# ==========================================
bind = SUPER CTRL, H, resizeactive, -20 0
bind = SUPER CTRL, L, resizeactive, 20 0
bind = SUPER CTRL, K, resizeactive, 0 -20
bind = SUPER CTRL, J, resizeactive, 0 20

#===========================================
# WINDOW RULES
#===========================================
windowrule = float 1, match:class ^(org\.pulseaudio\.pavucontrol)$
windowrule = float 1, match:class ^(nm-connection-editor)$
# windowrule = float 1, match:class ^(blueman-manager)$
windowrule = float 1, match:class ^(thunar)$, match:title ^(File Operation Progress)$
