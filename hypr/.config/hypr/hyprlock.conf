background {
    monitor =
    path = screenshot
    blur_passes = 3
    blur_size = 8
    noise = 0.0117
    contrast = 0.8916
    brightness = 0.8172
    vibrancy = 0.1696
    vibrancy_darkness = 0.0
}

input-field {
    monitor =
    size = 250, 60
    outline_thickness = 2
    dots_size = 0.3
    dots_spacing = 0.2
    dots_center = true
    outer_color = rgb(b4befe)
    inner_color = rgb(1e1e2e)
    font_color = rgb(cdd6f4)
    fade_on_empty = false
    placeholder_text = <i>Password...</i>
    hide_input = false
    position = 0, -40
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] echo "$(date '+%I:%M %p')"
    color = rgb(cdd6f4)
    font_size = 72
    font_family = JetBrainsMono Nerd Font Propo
    position = 0, 100
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:86400000] echo "$(date '+%A, %B %d')"
    color = rgb(b4befe)
    font_size = 20
    font_family = JetBrainsMono Nerd Font Propo
    position = 0, 20
    halign = center
    valign = center
}
